# Case settings. Run.jl sets AC_OPF and DC_OPF to choose the transmission model
# (transport, DCOPF or ACOPF); all other settings are shared.
NetworkExpansion: 1          # Transmission expansion (as parallel circuits under DCOPF/ACOPF)
ParameterScale: 1
TimeDomainReduction: 1       # 32 representative weeks, see time_domain_reduction_settings.yml
Trans_Loss_Segments: 1       # Transport: fixed loss % per line (calibrated from ACOPF)
LDSAdditionalConstraints: 1
StorageLosses: 0
UCommit: 0
OperationalReserves: 0
CapacityReserveMargin: 0
EnergyShareRequirement: 0
CO2Cap: 0
MinCapReq: 0
OutputFullTimeSeries: 0
WriteShadowPrices: 1
OverwriteResults: 1

# 5 GW cap on total thermal capacity per zone. The ERCOT build notebook writes these
# folders (or run build_thermal_zonal_cap.py)
MaxCapReq: 1
ResourcesFolder: resources_thermal_zonal_cap
PoliciesFolder: policies_thermal_zonal_cap

# Transmission model (set by Run.jl)
AC_OPF: 0
DC_OPF: 0

# Power factors and reactive power (ACOPF); MeanPowerFactor also derates line MVA
# ratings for transport/DCOPF so all three models see comparable active power capacity
ThermalPowerFactor: 0.85
InverterPowerFactor: 0.95
MeanPowerFactor: 0.9
PowerFactorSpread: 0.02
ShuntFraction: 1.0
