name: Test-examples

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [acopf, main, develop]
    tags: ['*']
  schedule:
    - cron: 21 4 * * * # Run at 12:21am US Eastern time

jobs:
  test:
    strategy:
      matrix:
        version: ["1.9", "1.10", '1']
        os: [ubuntu-latest]
        arch: [x64]
        include:
          - version: '1'
            os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@latest
      - name: Test examples
        shell: julia --project=. --color=yes {0}
        run: |
          include("test/test_examples.jl")
